<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akura Teacher - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons (Sleeker than FontAwesome) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], }
                }
            }
        }
    </script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body
    class="bg-slate-50 flex h-screen overflow-hidden font-sans antialiased text-slate-800 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Sidebar -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20">
        <div class="p-6 flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-xl shadow-sm overflow-hidden flex items-center justify-center p-1">
                <img src="/media/images/Logo - 123.png" alt="Logo" class="w-full h-full object-cover rounded-lg mix-blend-multiply">
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight leading-tight">Akura Teacher</h1>
                <p class="text-xs text-slate-400 font-medium">Instructor Panel</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 py-4">
            <ul class="space-y-1.5" id="navMenu">
                <li><button onclick="window.location.href='{% url 'teacher-panel-dashboard' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all text-white bg-indigo-600 shadow-md shadow-indigo-900/20"><i
                            class="ph ph-squares-four text-xl"></i> <span
                            class="font-semibold text-sm">Dashboard</span></button></li>
            </ul>
        </nav>

        <div class="p-4">
            <button id="logoutBtn"
                class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-red-500 hover:text-white text-slate-300 py-3 rounded-xl transition-all text-sm font-semibold">
                <i class="ph ph-sign-out text-lg"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <!-- Top Header -->
        <header
            class="bg-white/80 backdrop-blur-md sticky top-0 z-10 px-8 py-5 flex justify-between items-center border-b border-slate-200/60">
            <h2 id="pageTitle" class="text-2xl font-bold text-slate-900 tracking-tight">Teacher Overview</h2>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-bold text-slate-900" id="headerTeacherName">Instructor</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-indigo-100 border border-indigo-200 flex items-center justify-center text-indigo-700 font-bold">
                    T
                </div>
            </div>
        </header>

        <div class="p-8 max-w-7xl mx-auto w-full">
            <!-- Toast Notification -->
            <div id="toast" class="hidden fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl z-50 transition-all transform flex items-center gap-3 font-medium text-sm border"></div>

            {% block content %}{% endblock %}

        </div>
    </main>


    {% block scripts %}
    <script>
        function getAccessToken() {
            return localStorage.getItem('teacher_access_token');
        }

        async function refreshAccessToken() {
            const refresh = localStorage.getItem('teacher_refresh_token');
            if (!refresh) return false;
            try {
                const res = await fetch('/api/users/auth/login/refresh/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('teacher_access_token', data.access);
                    return true;
                }
            } catch (e) {
                console.error("Token refresh failed", e);
            }
            return false;
        }

        if (!getAccessToken()) window.location.href = '/teacher-panel/login/';
        
        async function apiCall(endpoint, method = 'GET', body = null, isRetry = false) {
            let token = getAccessToken();
            if (!token) {
                window.location.href = '/teacher-panel/login/';
                return null;
            }

            const options = { method, headers: { 'Authorization': `Bearer ${token}` } };
            if (body) {
                if (body instanceof FormData) {
                    options.body = body;
                } else {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }
            }
            try {
                const res = await fetch(`/api/${endpoint}`, options);
                
                if (res.status === 401 && !isRetry) {
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        return await apiCall(endpoint, method, body, true);
                    } else {
                        window.location.href = '/teacher-panel/login/';
                        return null;
                    }
                }

                if (!res.ok) {
                    let errMsg = 'API Error';
                    try {
                        const errData = await res.json();
                        errMsg = errData.error || errData.detail || JSON.stringify(errData);
                    } catch (e) {}
                    throw new Error(errMsg);
                }
                if (method !== 'DELETE') return await res.json();
                return true;
            } catch (err) {
                showToast(err.message || 'Action failed. Please try again.', 'error');
                console.error(err);
                return null;
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-2xl"></i>' : '<i class="ph-fill ph-warning-circle text-2xl"></i>';
            const colors = type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200 shadow-emerald-900/5' : 'bg-red-50 text-red-800 border-red-200 shadow-red-900/5';
            toast.innerHTML = `${icon} <span>${msg}</span>`;
            toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-xl z-50 transition-all transform flex items-center gap-3 font-semibold text-sm border ${colors}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('teacher_access_token');
            localStorage.removeItem('teacher_refresh_token');
            window.location.href = '/teacher-panel/login/';
        });

    </script>
    {% endblock %}
</body>
</html>
