{% extends 'admin_panel/base.html' %}
{% block content %}
<div id="tab-mcqs" class="block">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-slate-800">MCQ Bank</h3>
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <i class="ph ph-funnel absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <select id="mcqFilter" onchange="fetchFilteredMCQs()" class="pl-10 pr-8 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-56 shadow-sm transition-all appearance-none cursor-pointer">
                                <option value="" disabled selected>Select a Sub-Course</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button id="bulkDeleteBtn-mcq" onclick="bulkDelete('mcq', 'learning/admin/mcqs/')" class="hidden bg-red-50 text-red-600 border border-red-100 px-4 py-2.5 rounded-xl text-sm font-semibold hover:bg-red-100 transition-all shadow-sm"><i class="ph ph-trash"></i> Delete Selected</button>
                            
                            <button onclick="openCSVModal('mcq')"
                                class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-indigo-700 transition-all shadow-sm flex items-center gap-2"><i
                                    class="ph ph-upload-simple text-lg"></i> Upload CSV</button>
                            <button onclick="openModal('mcqModal')"
                                class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-800 transition-all shadow-sm flex items-center gap-2"><i
                                    class="ph ph-plus-circle text-lg"></i> Add Question</button>
                        </div>
                    </div>
                </div>
                
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider font-bold border-b border-slate-100">
                                    <th class="px-6 py-4 w-12"><input type="checkbox" onchange="toggleSelectAll(this, 'mcq')" class="w-4 h-4 text-indigo-600 rounded border-slate-300"></th>
                                    <th class="px-6 py-4">#</th>
                                    <th class="px-6 py-4">Course</th>
                                    <th class="px-6 py-4">Question Text</th>
                                    <th class="px-6 py-4">Options</th>
                                    <th class="px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="mcqTableBody" class="text-sm divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- MCQ Modal -->
            <div id="mcqModal"
                class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
                <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-3xl transform scale-100 transition-transform max-h-[90vh] overflow-y-auto">
                    <h3 class="text-2xl font-bold text-slate-900 mb-6" id="mcqModalTitle">New MCQ Question</h3>
                    <form id="mcqForm" onsubmit="submitMCQ(event)">
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Sub-Course</label>
                                <select id="mcqCourseId" required
                                    class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none appearance-none"></select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Question Text</label>
                                <textarea id="mcqQuestionText" required rows="3"
                                    class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none resize-none"></textarea>
                            </div>

                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Image (Optional)</label>
                                    <input type="file" id="mcqImage" accept="image/*"
                                        class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Voice (Optional)</label>
                                    <input type="file" id="mcqVoice" accept="audio/*"
                                        class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                                </div>
                            </div>

                            <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                <div class="flex justify-between items-center mb-4">
                                    <h4 class="font-bold text-slate-800">Answer Options</h4>
                                    <button type="button" onclick="addMCQOptionRow()"
                                        class="text-sm font-semibold text-indigo-600 hover:text-indigo-700 flex items-center gap-1 bg-indigo-50 px-3 py-1.5 rounded-lg transition-colors">
                                        <i class="ph ph-plus"></i> Add Option
                                    </button>
                                </div>
                                <p class="text-xs text-slate-500 mb-4">Select the radio button next to the correct answer(s).</p>
                                <div id="mcqOptionsContainer" class="space-y-3">
                                    <!-- Options injected here -->
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 mt-8">
                            <button type="button" onclick="closeModal('mcqModal')"
                                class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
                            <button type="submit" id="mcqSubmitBtn"
                                class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-slate-800 transition-all shadow-sm">Save Question & Options</button>
                        </div>
                    </form>
                </div>
            </div>

{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
function openModal(modalId, isEdit = false) { 
            editMode = isEdit;
            document.getElementById(modalId).classList.remove('hidden'); 
            
            if (modalId === 'domainModal') {
                document.getElementById('domainModalTitle').innerText = isEdit ? 'Edit Domain' : 'Add Domain';
                document.getElementById('domainSubmitBtn').innerText = isEdit ? 'Update Domain' : 'Save Domain';
            } else if (modalId === 'parentCourseModal') {
                document.getElementById('parentCourseModalTitle').innerText = isEdit ? 'Edit Parent Course' : 'Add Parent Course';
                document.getElementById('parentCourseSubmitBtn').innerText = isEdit ? 'Update Course' : 'Save Course';
            } else if (modalId === 'courseModal') {
                document.getElementById('courseModalTitle').innerText = isEdit ? 'Edit Sub-Course' : 'Add Sub-Course';
                document.getElementById('courseSubmitBtn').innerText = isEdit ? 'Update Sub-Course' : 'Save Sub-Course';
            } else if (modalId === 'flashcardModal') {
                document.getElementById('flashcardModalTitle').innerText = isEdit ? 'Edit Flashcard' : 'Create Flashcard';
                document.getElementById('flashcardSubmitBtn').innerText = isEdit ? 'Update Flashcard' : 'Save Flashcard';
            } else if (modalId === 'mcqModal') {
                document.getElementById('mcqModalTitle').innerText = isEdit ? 'Edit MCQ Question' : 'New MCQ Question';
                document.getElementById('mcqSubmitBtn').innerText = isEdit ? 'Update Question & Options' : 'Save Question & Options';
                if (!isEdit) {
                    document.getElementById('mcqImage').value = '';
                    document.getElementById('mcqVoice').value = '';
                    document.getElementById('mcqOptionsContainer').innerHTML = '';
                    addMCQOptionRow('', true);
                    addMCQOptionRow();
                }
            }
        }

async function fetchFilteredMCQs() {
            const filterCourseId = document.getElementById('mcqFilter').value;
            const tbody = document.getElementById('mcqTableBody');
            
            if (!filterCourseId) {
                state.mcqs = [];
                renderMCQs();
                return;
            }
            
            tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500"><div class="flex justify-center items-center gap-2"><div class="animate-spin rounded-full h-5 w-5 border-b-2 border-indigo-600"></div>Loading...</div></td></tr>';
            
            const mData = await apiCall(`learning/admin/mcqs/?subcourse_id=${filterCourseId}`);
            if (mData) {
                state.mcqs = mData.results || mData;
                renderMCQs();
            } else {
                state.mcqs = [];
                renderMCQs();
            }
        }

function renderMCQs() {
            const tbody = document.getElementById('mcqTableBody');
            
            if (state.mcqs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No MCQs found. Select a sub-course to load data.</td></tr>';
                return;
            }

            tbody.innerHTML = state.mcqs.map((m, index) => {
                const courseName = state.courses.find(c => c.id === m.subcourse)?.title || 'Unknown';
                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4"><input type="checkbox" value="${m.id}" class="row-checkbox-mcq w-4 h-4 text-indigo-600 rounded border-slate-300" onchange="updateBulkDeleteBtn('mcq')"></td>
                    <td class="px-6 py-4 text-slate-500 font-medium text-lg">#${index + 1}</td>
                    <td class="px-6 py-4 text-slate-500 font-medium">${courseName}</td>
                    <td class="px-6 py-4 font-medium text-slate-800">${m.text.substring(0, 50)}...</td>
                    <td class="px-6 py-4 text-slate-500 font-medium">${(m.options || []).length} Options</td>
                    <td class="px-6 py-4 text-right whitespace-nowrap">
                        <button onclick="editMCQ(${m.id})" class="text-slate-400 hover:text-blue-500 transition-colors p-2 rounded-lg hover:bg-blue-50"><i class="ph ph-pencil-simple text-lg"></i></button>
                        <button onclick="deleteMCQ(${m.id})" class="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50"><i class="ph ph-trash text-lg"></i></button>
                    </td>
                </tr>
            `}).join('');
        }

async function submitMCQ(e) {
            e.preventDefault();
            
            const optionInputs = document.querySelectorAll('.mcq-option-input');
            const correctRadios = document.querySelectorAll('input[name="correctOption"]');
            
            let incoming_options = [];
            let hasCorrect = false;

            optionInputs.forEach((input, index) => {
                if (input.value.trim() === '') return;
                const isCorrect = correctRadios[index] ? correctRadios[index].checked : false;
                if(isCorrect) hasCorrect = true;
                incoming_options.push({ text: input.value, is_correct: isCorrect });
            });

            if (!hasCorrect && incoming_options.length > 0) {
                showToast('Please select a correct option.', 'error');
                return;
            }

                        const formData = new FormData();
            formData.append('subcourse', document.getElementById('mcqCourseId').value);
            formData.append('text', document.getElementById('mcqQuestionText').value);
            formData.append('incoming_options', JSON.stringify(incoming_options));
            
            const imgFile = document.getElementById('mcqImage').files[0];
            if (imgFile) formData.append('image', imgFile);
            
            const voiceFile = document.getElementById('mcqVoice').files[0];
            if (voiceFile) formData.append('voice', voiceFile);

            const method = editMode ? 'PUT' : 'POST';
            const endpoint = editMode ? `learning/admin/mcqs/${currentEditId}/` : 'learning/admin/mcqs/';
            
            const res = await apiCall(endpoint, method, formData);
            if (res) { showToast(editMode ? 'Question & Options updated!' : 'Question & Options added!'); closeModal('mcqModal'); location.reload(); }
        }

function editMCQ(id) {
            const m = state.mcqs.find(x => x.id === id);
            if(!m) return;
            currentEditId = id;
            document.getElementById('mcqCourseId').value = m.subcourse;
            document.getElementById('mcqQuestionText').value = m.text;
            document.getElementById('mcqImage').value = '';
            document.getElementById('mcqVoice').value = '';
            
            const container = document.getElementById('mcqOptionsContainer');
            container.innerHTML = '';
            if (m.options && m.options.length > 0) {
                m.options.forEach(opt => {
                    addMCQOptionRow(opt.text, opt.is_correct);
                });
            } else {
                addMCQOptionRow('', true);
                addMCQOptionRow();
            }
            openModal('mcqModal', true);
        }

function populateCourseDropdowns() {
            const fcCourseId = document.getElementById('fcCourseId');
            const mcqCourseId = document.getElementById('mcqCourseId');
            const csvCourseId = document.getElementById('csvCourseId');
            const flashcardFilter = document.getElementById('flashcardFilter');
            const mcqFilter = document.getElementById('mcqFilter');

            const valFc = fcCourseId ? fcCourseId.value : '';
            const valMcq = mcqCourseId ? mcqCourseId.value : '';
            const valCsv = csvCourseId ? csvCourseId.value : '';
            const valFcFilter = flashcardFilter ? flashcardFilter.value : 'all';
            const valMcqFilter = mcqFilter ? mcqFilter.value : '';

            const options = state.courses.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
            const filterOptions = '<option value="" disabled selected>Select a Sub-Course</option>' + options;
            const fcFilterOptions = '<option value="all">All Sub-Courses</option>' + options;
            
            if(fcCourseId) fcCourseId.innerHTML = options;
            if(mcqCourseId) mcqCourseId.innerHTML = options;
            if(csvCourseId) csvCourseId.innerHTML = options;
            if(flashcardFilter) flashcardFilter.innerHTML = fcFilterOptions;
            if(mcqFilter) mcqFilter.innerHTML = filterOptions;

            if(fcCourseId && valFc) fcCourseId.value = valFc;
            if(mcqCourseId && valMcq) mcqCourseId.value = valMcq;
            if(csvCourseId && valCsv) csvCourseId.value = valCsv;
            if(flashcardFilter && valFcFilter) flashcardFilter.value = valFcFilter;
            if(mcqFilter && valMcqFilter) mcqFilter.value = valMcqFilter;
        }

function addMCQOptionRow(text = '', isCorrect = false) {
            const container = document.getElementById('mcqOptionsContainer');
            const rowCount = container.children.length;
            const div = document.createElement('div');
            div.className = "flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl";
            div.innerHTML = `
                <input type="radio" name="correctOption" value="${rowCount}" class="w-5 h-5 text-emerald-600 border-gray-300 focus:ring-emerald-500" ${isCorrect ? 'checked' : ''}>
                <input type="text" required placeholder="Option text..." value="${text}" class="mcq-option-input flex-1 border-none bg-transparent focus:ring-0 outline-none text-sm px-2">
                <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-red-500 p-1"><i class="ph ph-trash text-lg"></i></button>
            `;
            container.appendChild(div);
        }

async function deleteMCQ(id) { if (confirm('Delete this MCQ?')) { await apiCall(`learning/admin/mcqs/${id}/`, 'DELETE'); location.reload(); } }

document.addEventListener('DOMContentLoaded', async () => {
    const cData = await apiCall('learning/admin/subcourses/'); 
    if(cData) { 
        state.courses = cData.results || cData; 
        populateCourseDropdowns(); 
    } 
    state.mcqs = [];
    renderMCQs();
});
</script>
{% endblock %}
