<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akura Admin - Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Premium Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Phosphor Icons (Sleeker than FontAwesome) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .tab-content.active {
            display: block;
            opacity: 1;
        }

        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], }
                }
            }
        }
    </script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    
    <!-- Cropper.js -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
</head>

<body
    class="bg-slate-50 flex h-screen overflow-hidden font-sans antialiased text-slate-800 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Sidebar -->
    <aside class="w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl z-20">
        <div class="p-6 flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-xl shadow-sm overflow-hidden flex items-center justify-center p-1">
                <img src="/media/images/Logo - 123.png" alt="Logo" class="w-full h-full object-cover rounded-lg mix-blend-multiply">
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-tight leading-tight">Akura Admin</h1>
                <p class="text-xs text-slate-400 font-medium">Master Workspace</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-4 py-4">
            <ul class="space-y-1.5" id="navMenu">
                <li><button onclick="window.location.href='{% url 'custom-admin-dashboard' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all text-white bg-indigo-600 shadow-md shadow-indigo-900/20"><i
                            class="ph ph-squares-four text-xl"></i> <span
                            class="font-semibold text-sm">Dashboard</span></button></li>

                <div class="pt-4 pb-1">
                    <p class="px-4 text-xs font-bold tracking-wider text-slate-500 uppercase">Learning Engine</p>
                </div>

                <li><button onclick="window.location.href='{% url 'custom-admin-domains' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-globe text-xl"></i> <span
                            class="font-medium text-sm">Domains</span></button></li>
                <li><button onclick="window.location.href='{% url 'custom-admin-courses' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-folder text-xl"></i> <span
                            class="font-medium text-sm">Courses (Parent)</span></button></li>
                <li><button onclick="window.location.href='{% url 'custom-admin-subcourses' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-books text-xl"></i> <span
                            class="font-medium text-sm">Sub-Courses</span></button></li>
                <li><button onclick="window.location.href='{% url 'custom-admin-flashcards' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-cards text-xl"></i> <span
                            class="font-medium text-sm">Flashcards</span></button></li>
                <li><button onclick="window.location.href='{% url 'custom-admin-mcqs' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-list-checks text-xl"></i> <span
                            class="font-medium text-sm">MCQs</span></button></li>

                <div class="pt-4 pb-1">
                    <p class="px-4 text-xs font-bold tracking-wider text-slate-500 uppercase">Administration</p>
                </div>

                <li><button onclick="window.location.href='{% url 'custom-admin-users' %}'"
                        class="nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all hover:bg-slate-800 hover:text-white"><i
                            class="ph ph-users text-xl"></i> <span class="font-medium text-sm">Users</span></button>
                </li>
            </ul>
        </nav>

        <div class="p-4">
            <button id="logoutBtn"
                class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-red-500 hover:text-white text-slate-300 py-3 rounded-xl transition-all text-sm font-semibold">
                <i class="ph ph-sign-out text-lg"></i> Sign Out
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <!-- Top Header -->
        <header
            class="bg-white/80 backdrop-blur-md sticky top-0 z-10 px-8 py-5 flex justify-between items-center border-b border-slate-200/60">
            <h2 id="pageTitle" class="text-2xl font-bold text-slate-900 tracking-tight">Dashboard Overview</h2>
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-bold text-slate-900">Administrator</p>
                    <p class="text-xs text-slate-500">admin@akura.edu</p>
                </div>
                <div
                    class="w-10 h-10 rounded-full bg-indigo-100 border border-indigo-200 flex items-center justify-center text-indigo-700 font-bold">
                    A
                </div>
            </div>
        </header>

        <div class="p-8 max-w-7xl mx-auto w-full">
            <!-- Toast Notification -->
            <div id="toast" class="hidden fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-2xl z-50 transition-all transform flex items-center gap-3 font-medium text-sm border"></div>

            {% block content %}{% endblock %}

    
    <!-- Icon Picker Modal -->
    <div id="iconPickerModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[60] p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-2xl transform scale-100 transition-transform flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-slate-900">Choose Icon</h3>
                <button onclick="closeModal('iconPickerModal')" class="text-slate-400 hover:text-slate-600"><i class="ph ph-x text-2xl"></i></button>
            </div>
            
            <div class="relative mb-6">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="iconSearchInput" placeholder="Search icons (e.g., book, math, science)..." 
                    class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
            </div>

            <div id="iconGrid" class="flex-1 overflow-y-auto grid grid-cols-6 sm:grid-cols-8 gap-4 p-2">
                <!-- Icons injected here -->
            </div>
            
            <div class="mt-4 flex justify-end">
                <button onclick="closeModal('iconPickerModal')" class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
            </div>
        </div>
    </div>

    <!-- CSV Upload Modal -->
    <div id="csvUploadModal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md transform scale-100 transition-transform">
            <h3 class="text-2xl font-bold text-slate-900 mb-6" id="csvModalTitle">Upload CSV</h3>
            <form id="csvUploadForm" onsubmit="uploadCSV(event)">
                <input type="hidden" id="csvModelType">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Sub-Course</label>
                        <select id="csvCourseId" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none appearance-none"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Start Row</label>
                            <input type="number" id="csvStartRow" value="1" required
                                class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">End Row (-1 for all)</label>
                            <input type="number" id="csvEndRow" value="-1" required
                                class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">CSV File</label>
                        <input type="file" id="csvFile" accept=".csv" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="closeModal('csvUploadModal')"
                        class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
                    <button type="submit" id="csvSubmitBtn"
                        class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-sm">Upload & Import</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Global Image Cropper Modal -->
    <div id="globalCropperModal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[100] p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-4xl transform scale-100 transition-transform flex flex-col h-[85vh]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-slate-900">Crop Image</h3>
                <div class="flex items-center gap-3">
                    <label class="text-sm font-medium text-slate-600">Aspect Ratio:</label>
                    <select id="cropperAspectRatio" class="border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                        <option value="NaN">Free</option>
                        <option value="1.7777777777777777">16:9</option>
                        <option value="0.8">4:5</option>
                        <option value="1.25">5:4</option>
                        <option value="0.75">3:4</option>
                        <option value="1.3333333333333333">4:3</option>
                        <option value="0.6666666666666666">2:3</option>
                        <option value="1.5">3:2</option>
                        <option value="1.4">7:5</option>
                        <option value="0.7142857142857143">5:7</option>
                        <option value="1">1:1</option>
                    </select>
                </div>
            </div>
            
            <div class="flex-1 bg-slate-100 rounded-2xl overflow-hidden relative">
                <img id="cropperImage" src="" class="block max-w-full">
            </div>
            
            <div class="mt-6 flex justify-end gap-3">
                <button type="button" id="cropperCancelBtn" class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
                <button type="button" id="cropperSaveBtn" class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-indigo-700 transition-all shadow-sm">Crop & Save</button>
            </div>
        </div>
    </div>

        </div>
    </main>


    {% block scripts %}
    <script>
        function getAccessToken() {
            return localStorage.getItem('access_token');
        }

        async function refreshAccessToken() {
            const refresh = localStorage.getItem('refresh_token');
            if (!refresh) return false;
            try {
                const res = await fetch('/api/users/auth/login/refresh/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('access_token', data.access);
                    return true;
                }
            } catch (e) {
                console.error("Token refresh failed", e);
            }
            return false;
        }

        if (!getAccessToken()) window.location.href = '/custom-admin/login/';
        
        let state = { domains: [], parentcourses: [], courses: [], flashcards: [], mcqs: [], users: [] };
        let editMode = false;
        let currentEditId = null;

        async function apiCall(endpoint, method = 'GET', body = null, isRetry = false) {
            let token = getAccessToken();
            if (!token) {
                window.location.href = '/custom-admin/login/';
                return null;
            }

            const options = { method, headers: { 'Authorization': `Bearer ${token}` } };
            if (body) {
                if (body instanceof FormData) {
                    options.body = body;
                } else {
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(body);
                }
            }
            try {
                const res = await fetch(`/api/${endpoint}`, options);
                
                if (res.status === 401 && !isRetry) {
                    const refreshed = await refreshAccessToken();
                    if (refreshed) {
                        return await apiCall(endpoint, method, body, true);
                    } else {
                        window.location.href = '/custom-admin/login/';
                        return null;
                    }
                }

                if (!res.ok) {
                    let errMsg = 'API Error';
                    try {
                        const errData = await res.json();
                        errMsg = errData.error || errData.detail || JSON.stringify(errData);
                    } catch (e) {}
                    throw new Error(errMsg);
                }
                if (method !== 'DELETE') return await res.json();
                return true;
            } catch (err) {
                showToast(err.message || 'Action failed. Please try again.', 'error');
                console.error(err);
                return null;
            }
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-2xl"></i>' : '<i class="ph-fill ph-warning-circle text-2xl"></i>';
            const colors = type === 'success' ? 'bg-emerald-50 text-emerald-800 border-emerald-200 shadow-emerald-900/5' : 'bg-red-50 text-red-800 border-red-200 shadow-red-900/5';
            toast.innerHTML = `${icon} <span>${msg}</span>`;
            toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-2xl shadow-xl z-50 transition-all transform flex items-center gap-3 font-semibold text-sm border ${colors}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            const form = document.querySelector(`#${modalId} form`);
            if (form) form.reset();
            
            // Only reset global edit state if we are closing a primary form modal, 
            // not a nested modal like the icon picker.
            if (modalId !== 'iconPickerModal') {
                editMode = false;
                currentEditId = null;
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            window.location.href = '/custom-admin/login/';
        });

                function toggleSelectAll(masterCheckbox, type) {
            const checkboxes = document.querySelectorAll(`.row-checkbox-${type}`);
            checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
            updateBulkDeleteBtn(type);
        }

        function updateBulkDeleteBtn(type) {
            const checkboxes = document.querySelectorAll(`.row-checkbox-${type}:checked`);
            const btn = document.getElementById(`bulkDeleteBtn-${type}`);
            if (btn) {
                if (checkboxes.length > 0) {
                    btn.classList.remove('hidden');
                    btn.innerText = `Delete Selected (${checkboxes.length})`;
                } else {
                    btn.classList.add('hidden');
                }
            }
        }

        async function bulkDelete(type, baseUrl) {
            const checkboxes = document.querySelectorAll(`.row-checkbox-${type}:checked`);
            const ids = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (ids.length === 0) return;
            
            if (!confirm(`Are you sure you want to delete ${ids.length} items? This cannot be undone.`)) return;

            const btn = document.getElementById(`bulkDeleteBtn-${type}`);
            const origText = btn.innerText;
            btn.innerText = 'Deleting...';
            btn.disabled = true;

            const res = await apiCall(`${baseUrl}bulk_delete/`, 'DELETE', { ids: ids });
            if (res) {
                showToast(res.message || 'Items deleted successfully!');
                setTimeout(() => location.reload(), 800);
            } else {
                btn.innerText = origText;
                btn.disabled = false;
            }
        }

        // Set active nav button
        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                const onclick = btn.getAttribute('onclick');
                if (onclick && onclick.includes(`'${path}'`)) {
                    btn.className = "nav-btn w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all text-white bg-indigo-600 shadow-md shadow-indigo-900/20";
                }
            });
        });
        
        let currentIconTarget = null;
        let searchTimeout = null;

        function openIconPicker(targetInputId) {
            currentIconTarget = targetInputId;
            document.getElementById('iconPickerModal').classList.remove('hidden');
            const input = document.getElementById('iconSearchInput');
            input.value = '';
            document.getElementById('iconGrid').innerHTML = '<p class="col-span-full text-center text-slate-500 py-8">Type to search for icons...</p>';
            input.focus();
        }

        document.getElementById('iconSearchInput')?.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) return;
            
            searchTimeout = setTimeout(async () => {
                const grid = document.getElementById('iconGrid');
                grid.innerHTML = '<div class="col-span-full flex justify-center py-8"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600"></div></div>';
                
                try {
                    const res = await fetch(`https://api.iconify.design/search?query=${encodeURIComponent(query)}&limit=64`);
                    const data = await res.json();
                    
                    if (data.icons && data.icons.length > 0) {
                        grid.innerHTML = data.icons.map(icon => `
                            <button onclick="selectIcon('${icon}')" class="flex flex-col items-center justify-center p-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition-colors border border-transparent hover:border-indigo-100 group">
                                <iconify-icon icon="${icon}" class="text-3xl text-slate-600 group-hover:text-indigo-600 transition-colors"></iconify-icon>
                            </button>
                        `).join('');
                    } else {
                        grid.innerHTML = '<p class="col-span-full text-center text-slate-500 py-8">No icons found.</p>';
                    }
                } catch (err) {
                    grid.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Failed to load icons.</p>';
                }
            }, 500);
        });

        function selectIcon(iconId) {
            if (currentIconTarget) {
                const targetInput = document.getElementById(currentIconTarget);
                if (targetInput) targetInput.value = iconId;
                
                // Update preview if it exists
                const preview = document.getElementById(currentIconTarget + 'Preview');
                if (preview) {
                    preview.innerHTML = `<iconify-icon icon="${iconId}" class="text-2xl text-indigo-600"></iconify-icon>`;
                }
            }
            closeModal('iconPickerModal');
        }

        function openCSVModal(modelType) {
            document.getElementById('csvModelType').value = modelType;
            document.getElementById('csvModalTitle').innerText = modelType === 'flashcard' ? 'Upload Flashcards CSV' : 'Upload MCQs CSV';
            document.getElementById('csvUploadModal').classList.remove('hidden');
        }

        async function uploadCSV(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('model_type', document.getElementById('csvModelType').value);
            formData.append('subcourse_id', document.getElementById('csvCourseId').value);
            formData.append('start_row', document.getElementById('csvStartRow').value);
            formData.append('end_row', document.getElementById('csvEndRow').value);
            formData.append('file', document.getElementById('csvFile').files[0]);

            const btn = document.getElementById('csvSubmitBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Uploading...';
            btn.disabled = true;

            try {
                const res = await apiCall('learning/admin/csv-upload/', 'POST', formData);
                if (res) {
                    showToast('Data imported successfully!');
                    closeModal('csvUploadModal');
                    setTimeout(() => location.reload(), 1000);
                }
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
        
        // --- Global Image Cropper Logic ---
        let cropperInstance = null;
        let currentFileInput = null;
        let originalFileName = '';
        
        document.addEventListener('change', (e) => {
            if (e.target && e.target.type === 'file' && e.target.accept && e.target.accept.includes('image/*') && !e.target.dataset.cropped) {
                const file = e.target.files[0];
                if (file) {
                    currentFileInput = e.target;
                    originalFileName = file.name;
                    
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const cropperImage = document.getElementById('cropperImage');
                        cropperImage.src = event.target.result;
                        
                        document.getElementById('globalCropperModal').classList.remove('hidden');
                        
                        if (cropperInstance) {
                            cropperInstance.destroy();
                        }
                        
                        const selectedRatio = parseFloat(document.getElementById('cropperAspectRatio').value);
                        cropperInstance = new Cropper(cropperImage, {
                            aspectRatio: isNaN(selectedRatio) ? NaN : selectedRatio,
                            viewMode: 2,
                            autoCropArea: 1,
                            background: false,
                        });
                    };
                    reader.readAsDataURL(file);
                }
            }
        });
        
        document.getElementById('cropperAspectRatio').addEventListener('change', (e) => {
            if (cropperInstance) {
                const ratio = parseFloat(e.target.value);
                cropperInstance.setAspectRatio(isNaN(ratio) ? NaN : ratio);
            }
        });
        
        document.getElementById('cropperCancelBtn').addEventListener('click', () => {
            document.getElementById('globalCropperModal').classList.add('hidden');
            if (currentFileInput) {
                currentFileInput.value = ''; // Reset the input if cancelled
                currentFileInput = null;
            }
            if (cropperInstance) cropperInstance.destroy();
        });
        
        document.getElementById('cropperSaveBtn').addEventListener('click', () => {
            if (!cropperInstance || !currentFileInput) return;
            
            const btn = document.getElementById('cropperSaveBtn');
            btn.innerText = 'Saving...';
            btn.disabled = true;
            
            cropperInstance.getCroppedCanvas({
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            }).toBlob((blob) => {
                if (!blob) {
                    showToast('Failed to crop image', 'error');
                    btn.innerText = 'Crop & Save';
                    btn.disabled = false;
                    return;
                }
                
                const fileExtension = originalFileName.split('.').pop().toLowerCase();
                const mimeType = blob.type; 
                const newFile = new File([blob], originalFileName, { type: mimeType, lastModified: new Date().getTime() });
                
                const dataTransfer = new DataTransfer();
                dataTransfer.items.add(newFile);
                currentFileInput.files = dataTransfer.files;
                
                document.getElementById('globalCropperModal').classList.add('hidden');
                if (cropperInstance) cropperInstance.destroy();
                
                btn.innerText = 'Crop & Save';
                btn.disabled = false;
                
                currentFileInput.dataset.cropped = "true";
                currentFileInput.dispatchEvent(new Event('change', { bubbles: true }));
                
                showToast('Image cropped successfully!', 'success');
                currentFileInput = null;
                
            }, currentFileInput.files[0].type); 
        });

    </script>
    {% endblock %}
</body>
</html>
