{% extends 'admin_panel/base.html' %}
{% block content %}
<div id="tab-subcourses" class="block">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold text-slate-800">Course Directory</h3>
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <i class="ph ph-funnel absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <select id="subcourseCourseFilter" onchange="fetchFilteredCourses()" class="pl-10 pr-8 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-48 shadow-sm transition-all appearance-none cursor-pointer">
                                <option value="all">All Courses</option>
                            </select>
                        </div>
                        <div class="relative">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="courseSearch" onkeyup="filterCoursesLocally()" placeholder="Search courses..." class="pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-48 shadow-sm transition-all">
                        </div>
                        <button onclick="openModal('courseModal')"
                            class="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-sm font-semibold hover:bg-slate-800 transition-all shadow-sm flex items-center gap-2"><i
                                class="ph ph-plus-circle text-lg"></i> Add Course</button>
                    </div>
                </div>
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider font-bold border-b border-slate-100">
                                    <th class="px-6 py-4 w-12"><input type="checkbox" onchange="toggleSelectAll(this, 'course')" class="w-4 h-4 text-indigo-600 rounded border-slate-300"></th>
                                    <th class="px-6 py-4">ID</th>
                                    <th class="px-6 py-4">Parent Course</th>
                                    <th class="px-6 py-4">Title</th>
                                    <th class="px-6 py-4 w-32">Priority</th>
                                    <th class="px-6 py-4">Status</th>
                                    <th class="px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="courseTableBody" class="text-sm divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>

<div id="courseModal"
        class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4 transition-opacity">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-2xl transform scale-100 transition-transform">
            <h3 class="text-2xl font-bold text-slate-900 mb-6" id="courseModalTitle">Add Sub-Course</h3>
            <form id="courseForm" onsubmit="submitCourse(event)">
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Parent Course</label>
                        <select id="subcourseParentId" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none appearance-none"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Icon</label>
                        <div class="flex items-center gap-3">
                            <div id="courseIconPreview" class="w-12 h-12 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center">
                                <i class="ph ph-image text-slate-400"></i>
                            </div>
                            <input type="hidden" id="courseIcon" value="">
                            <button type="button" onclick="openIconPicker('courseIcon')" class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm">
                                Choose Icon
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Sub-Course Title</label>
                        <input type="text" id="courseTitle" required
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
                        <textarea id="courseDesc" rows="3"
                            class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none resize-none"></textarea>
                    </div>
                    <label
                        class="flex items-center gap-3 p-4 border border-emerald-100 bg-emerald-50/50 rounded-xl cursor-pointer hover:bg-emerald-50 transition-colors">
                        <input type="checkbox" id="courseIsFree"
                            class="w-5 h-5 text-emerald-600 rounded focus:ring-emerald-500 border-gray-300">
                        <div>
                            <span class="block text-sm font-bold text-emerald-900">Is Free</span>
                            <span class="block text-xs text-emerald-700 mt-0.5">Users can access this without buying the main course</span>
                        </div>
                    </label>
                    <label
                        class="flex items-center gap-3 p-4 border border-slate-100 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors">
                        <input type="checkbox" id="courseActive"
                            class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300" checked>
                        <span class="text-sm font-semibold text-slate-700">Course is Active</span>
                    </label>
                </div>
                <div class="flex justify-end gap-3 mt-8">
                    <button type="button" onclick="closeModal('courseModal')"
                        class="px-5 py-2.5 rounded-xl font-semibold text-slate-600 hover:bg-slate-100 transition-all">Cancel</button>
                    <button type="submit" id="courseSubmitBtn"
                        class="bg-slate-900 text-white px-6 py-2.5 rounded-xl font-semibold hover:bg-slate-800 transition-all shadow-sm">Save
                        Course</button>
                </div>
            </form>
        </div>
    </div>

{% endblock %}

{% block scripts %}
{{ block.super }}
<script>
function openModal(modalId, isEdit = false) { 
            editMode = isEdit;
            document.getElementById(modalId).classList.remove('hidden'); 
            
            if (modalId === 'domainModal') {
                document.getElementById('domainModalTitle').innerText = isEdit ? 'Edit Domain' : 'Add Domain';
                document.getElementById('domainSubmitBtn').innerText = isEdit ? 'Update Domain' : 'Save Domain';
            } else if (modalId === 'parentCourseModal') {
                document.getElementById('parentCourseModalTitle').innerText = isEdit ? 'Edit Parent Course' : 'Add Parent Course';
                document.getElementById('parentCourseSubmitBtn').innerText = isEdit ? 'Update Course' : 'Save Course';
            } else if (modalId === 'courseModal') {
                document.getElementById('courseModalTitle').innerText = isEdit ? 'Edit Sub-Course' : 'Add Sub-Course';
                if(!isEdit) { document.getElementById('courseIcon').value = ''; document.getElementById('courseIconPreview').innerHTML = `<i class="ph ph-image text-slate-400"></i>`; }
                document.getElementById('courseSubmitBtn').innerText = isEdit ? 'Update Sub-Course' : 'Save Sub-Course';
            } else if (modalId === 'flashcardModal') {
                document.getElementById('flashcardModalTitle').innerText = isEdit ? 'Edit Flashcard' : 'Create Flashcard';
                document.getElementById('flashcardSubmitBtn').innerText = isEdit ? 'Update Flashcard' : 'Save Flashcard';
            } else if (modalId === 'mcqModal') {
                document.getElementById('mcqModalTitle').innerText = isEdit ? 'Edit MCQ Question' : 'New MCQ Question';
                document.getElementById('mcqSubmitBtn').innerText = isEdit ? 'Update Question & Options' : 'Save Question & Options';
                if (!isEdit) {
                    document.getElementById('mcqOptionsContainer').innerHTML = '';
                    addMCQOptionRow('', true);
                    addMCQOptionRow();
                }
            }
        }

function renderCourses(coursesToRender) {
            const tbody = document.getElementById('courseTableBody');
            tbody.innerHTML = coursesToRender.map(c => {
                const parentName = state.parentcourses.find(p => p.id === c.course)?.title || 'Unknown';
                return `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="px-6 py-4"><input type="checkbox" value="${c.id}" class="row-checkbox-course w-4 h-4 text-indigo-600 rounded border-slate-300" onchange="updateBulkDeleteBtn('course')"></td>
                    <td class="px-6 py-4 text-slate-500 font-medium">#${c.id}</td>
                    <td class="px-6 py-4 text-slate-500 font-medium">${parentName}</td>
                    <td class="px-6 py-4 text-slate-500 font-medium">${state.domains.find(d => d.id === c.domain)?.title || 'Unknown'}</td>
                    <td class="px-6 py-4 font-bold text-slate-800 flex items-center gap-3">${c.icon ? `<iconify-icon icon="${c.icon}" class="text-xl text-indigo-600"></iconify-icon>` : `<i class="ph ph-book-open text-xl text-slate-400"></i>`} ${c.title}</td>
                    <td class="px-6 py-4">
                        <input type="number" value="${c.priority || 0}" onchange="updateParentCoursePriority(${c.id}, this.value)" class="w-20 border border-slate-200 rounded-lg px-2 py-1 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-bold rounded-md ${c.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                            <span class="w-1.5 h-1.5 rounded-full ${c.is_active ? 'bg-emerald-500' : 'bg-slate-400'}"></span>
                            ${c.is_active ? 'Active' : 'Draft'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right whitespace-nowrap">
                        <button onclick="editCourse(${c.id})" class="text-slate-400 hover:text-blue-500 transition-colors p-2 rounded-lg hover:bg-blue-50"><i class="ph ph-pencil-simple text-lg"></i></button>
                        <button onclick="deleteCourse(${c.id})" class="text-slate-400 hover:text-red-500 transition-colors p-2 rounded-lg hover:bg-red-50"><i class="ph ph-trash text-lg"></i></button>
                    </td>
                </tr>
            `}).join('');
        }

async function submitCourse(e) {
            e.preventDefault();
            const payload = { course: parseInt(document.getElementById('subcourseParentId').value), title: document.getElementById('courseTitle').value, description: document.getElementById('courseDesc').value,
                is_free: document.getElementById('courseIsFree').checked, icon: document.getElementById('courseIcon').value, is_active: document.getElementById('courseActive').checked };
            const method = editMode ? 'PUT' : 'POST';
            const endpoint = editMode ? `learning/admin/subcourses/${currentEditId}/` : 'learning/admin/subcourses/';
            const res = await apiCall(endpoint, method, payload);
            if (res) { showToast(editMode ? 'Sub-Course updated successfully!' : 'Sub-Course added successfully!'); closeModal('courseModal'); location.reload(); }
        }

function editCourse(id) {
            const c = state.courses.find(x => x.id === id);
            if(!c) return;
            currentEditId = id;
            document.getElementById('subcourseParentId').value = c.course;
            document.getElementById('courseTitle').value = c.title;
            document.getElementById('courseDesc').value = c.description;
            document.getElementById('courseIsFree').checked = c.is_free;
            document.getElementById('courseIcon').value = c.icon || '';
            document.getElementById('courseIconPreview').innerHTML = c.icon ? `<iconify-icon icon="${c.icon}" class="text-2xl text-indigo-600"></iconify-icon>` : `<i class="ph ph-image text-slate-400"></i>`;
            document.getElementById('courseActive').checked = c.is_active;
            openModal('courseModal', true);
        }

async function fetchFilteredCourses() {
            const subcourseFilter = document.getElementById('subcourseCourseFilter')?.value;
            let subUrl = 'learning/admin/subcourses/';
            if (subcourseFilter && subcourseFilter !== 'all') { subUrl += `?course_id=${subcourseFilter}`; }
            const cData = await apiCall(subUrl);
            if (cData) { state.courses = cData.results || cData;  renderCourses(state.courses); populateCourseDropdowns(); }
        }

async function updateCoursePriority(id, val) {
            await apiCall(`learning/admin/subcourses/${id}/`, 'PATCH', { priority: parseInt(val) });
            showToast('Sub-Course priority updated');
            fetchFilteredCourses();
        }

function populateParentCourseDropdowns() {
            const parentId = document.getElementById('subcourseParentId');
            const courseFilter = document.getElementById('subcourseCourseFilter');
            const currentParentIdVal = parentId ? parentId.value : '';
            const currentFilterVal = courseFilter ? courseFilter.value : 'all';

            const options = state.parentcourses.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
            const filterOptions = '<option value="all">All Parent Courses</option>' + options;
            
            if(parentId) parentId.innerHTML = options;
            if(courseFilter) courseFilter.innerHTML = filterOptions;

            if(parentId && currentParentIdVal) parentId.value = currentParentIdVal;
            if(courseFilter && currentFilterVal) courseFilter.value = currentFilterVal;
        }

function populateCourseDropdowns() {
            const fcCourseId = document.getElementById('fcCourseId');
            const mcqCourseId = document.getElementById('mcqCourseId');
            const csvCourseId = document.getElementById('csvCourseId');
            const flashcardFilter = document.getElementById('flashcardFilter');
            const mcqFilter = document.getElementById('mcqFilter');

            const valFc = fcCourseId ? fcCourseId.value : '';
            const valMcq = mcqCourseId ? mcqCourseId.value : '';
            const valCsv = csvCourseId ? csvCourseId.value : '';
            const valFcFilter = flashcardFilter ? flashcardFilter.value : 'all';
            const valMcqFilter = mcqFilter ? mcqFilter.value : 'all';

            const options = state.courses.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
            const filterOptions = '<option value="all">All Sub-Courses</option>' + options;
            
            if(fcCourseId) fcCourseId.innerHTML = options;
            if(mcqCourseId) mcqCourseId.innerHTML = options;
            if(csvCourseId) csvCourseId.innerHTML = options;
            if(flashcardFilter) flashcardFilter.innerHTML = filterOptions;
            if(mcqFilter) mcqFilter.innerHTML = filterOptions;

            if(fcCourseId && valFc) fcCourseId.value = valFc;
            if(mcqCourseId && valMcq) mcqCourseId.value = valMcq;
            if(csvCourseId && valCsv) csvCourseId.value = valCsv;
            if(flashcardFilter && valFcFilter) flashcardFilter.value = valFcFilter;
            if(mcqFilter && valMcqFilter) mcqFilter.value = valMcqFilter;
        }

async function deleteCourse(id) { if (confirm('Delete this sub-course? It will delete related MCQs and Flashcards.')) { await apiCall(`learning/admin/subcourses/${id}/`, 'DELETE'); location.reload(); } }

document.addEventListener('DOMContentLoaded', async () => {
const dData = await apiCall('learning/admin/domains/'); if(dData) { state.domains = dData.results || dData; }
const pData = await apiCall('learning/admin/courses/'); if(pData) { state.parentcourses = pData.results || pData; populateParentCourseDropdowns(); fetchFilteredCourses(); }
});
</script>
{% endblock %}
