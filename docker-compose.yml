version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: django_postgres_db
    restart: always
    environment:
      - POSTGRES_USER=flashcard_user
      - POSTGRES_PASSWORD=flashcard_password
      - POSTGRES_DB=flashcard_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: django_web_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./media:/app/media # Mounts the media folder to the host for persistent user uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_NAME=flashcard_db
      - DB_USER=flashcard_user
      - DB_PASSWORD=flashcard_password
      - DB_HOST=db
      - DB_PORT=5432
      - MONGO_URI=${MONGO_URI} # Injected MongoDB Atlas connection string
    depends_on:
      - db

volumes:
  postgres_data:
